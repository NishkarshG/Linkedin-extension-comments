name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json; setting it here
      # as well makes pnpm/action-setup fail with "Multiple versions of pnpm".
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build:only

      - name: Check content script budget and manifest
        run: |
          size=$(gzip -c dist/assets/content-script.js | wc -c)
          echo "content-script.js gzipped: ${size} bytes"
          test "$size" -lt 30720
          if grep -q "web_accessible_resources" dist/manifest.json; then
            echo "content script must not be web accessible" && exit 1
          fi

      - name: Package extension
        run: cd dist && zip -qr ../inlineai-extension.zip .

      - name: Upload extension zip
        uses: actions/upload-artifact@v4
        with:
          name: inlineai-extension
          path: inlineai-extension.zip
