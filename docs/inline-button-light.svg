<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="Inter Tight, Inter, system-ui, sans-serif">
  <rect width="720" height="440" fill="#EEF3F8"/>
  <!-- post card -->
  <g>
    <rect x="40" y="32" width="640" height="376" rx="12" fill="#FFFFFF" stroke="#E5E5DE"/>
    <!-- author -->
    <circle cx="80" cy="76" r="22" fill="#C9D6E5"/>
    <text x="116" y="70" font-size="15" font-weight="700" fill="#1B1B18">Priya Nair</text>
    <text x="116" y="90" font-size="12" fill="#6F6F68">Head of Product · Fintech</text>
    <text x="116" y="106" font-size="11" fill="#9A9A92">2h · 🌐</text>
    <!-- body -->
    <text x="64" y="146" font-size="14" fill="#1B1B18">Unpopular opinion: most "AI strategy" decks in 2026 are 2019 digital</text>
    <text x="64" y="170" font-size="14" fill="#1B1B18">transformation decks with find-and-replace. The budget conversations,</text>
    <text x="64" y="194" font-size="14" fill="#1B1B18">though, are genuinely different this time.</text>
    <!-- reactions row -->
    <line x1="64" y1="224" x2="656" y2="224" stroke="#EFEFE9"/>
    <text x="64" y="250" font-size="12" fill="#6F6F68">👍 248 · 63 comments</text>
    <line x1="64" y1="266" x2="656" y2="266" stroke="#EFEFE9"/>

    <!-- comment composer -->
    <rect x="64" y="292" width="592" height="92" rx="14" fill="#F4F2EC" stroke="#E5E5DE"/>
    <circle cx="92" cy="320" r="16" fill="#C9D6E5"/>
    <text x="120" y="325" font-size="13" fill="#9A9A92">Add a comment…</text>

    <!-- InlineAI pill -->
    <g>
      <rect x="494" y="304" width="148" height="30" rx="15" fill="#FFFFFF" stroke="#2563EB"/>
      <path d="M512 319 l1.6 -5.4 l1.6 5.4 l5.4 1.6 l-5.4 1.6 l-1.6 5.4 l-1.6 -5.4 l-5.4 -1.6 z" transform="translate(0,0)" fill="#2563EB"/>
      <text x="528" y="323" font-size="13" font-weight="700" fill="#2563EB">Write with AI</text>
    </g>
  </g>
  <text x="40" y="430" font-size="11" fill="#9A9A92">InlineAI — inline "Write with AI" button (LinkedIn light theme)</text>
</svg>
