<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="Inter Tight, Inter, system-ui, sans-serif">
  <rect width="720" height="440" fill="#1B1F23"/>
  <!-- post card -->
  <g>
    <rect x="40" y="32" width="640" height="376" rx="12" fill="#1D2226" stroke="#38393C"/>
    <!-- author -->
    <circle cx="80" cy="76" r="22" fill="#3A4756"/>
    <text x="116" y="70" font-size="15" font-weight="700" fill="#ECECEA">Priya Nair</text>
    <text x="116" y="90" font-size="12" fill="#A5A5A0">Head of Product · Fintech</text>
    <text x="116" y="106" font-size="11" fill="#7C7C76">2h · 🌐</text>
    <!-- body -->
    <text x="64" y="146" font-size="14" fill="#ECECEA">Unpopular opinion: most "AI strategy" decks in 2026 are 2019 digital</text>
    <text x="64" y="170" font-size="14" fill="#ECECEA">transformation decks with find-and-replace. The budget conversations,</text>
    <text x="64" y="194" font-size="14" fill="#ECECEA">though, are genuinely different this time.</text>
    <!-- reactions row -->
    <line x1="64" y1="224" x2="656" y2="224" stroke="#2C2F33"/>
    <text x="64" y="250" font-size="12" fill="#A5A5A0">👍 248 · 63 comments</text>
    <line x1="64" y1="266" x2="656" y2="266" stroke="#2C2F33"/>

    <!-- comment composer -->
    <rect x="64" y="292" width="592" height="92" rx="14" fill="#16191C" stroke="#38393C"/>
    <circle cx="92" cy="320" r="16" fill="#3A4756"/>
    <text x="120" y="325" font-size="13" fill="#7C7C76">Add a comment…</text>

    <!-- InlineAI pill -->
    <g>
      <rect x="494" y="304" width="148" height="30" rx="15" fill="#1D2226" stroke="#5B8DEF"/>
      <path d="M512 319 l1.6 -5.4 l1.6 5.4 l5.4 1.6 l-5.4 1.6 l-1.6 5.4 l-1.6 -5.4 l-5.4 -1.6 z" fill="#5B8DEF"/>
      <text x="528" y="323" font-size="13" font-weight="700" fill="#5B8DEF">Write with AI</text>
    </g>
  </g>
  <text x="40" y="430" font-size="11" fill="#7C7C76">InlineAI — inline "Write with AI" button (LinkedIn dark theme)</text>
</svg>
